# Minimal alembic.ini for the gate sandbox.
# Deliberately mirrors the real repo's shape: a relative script_location,
# resolved against whatever directory the command is run from — same trap
# documented in the main doc's Part 6.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///sandbox.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
