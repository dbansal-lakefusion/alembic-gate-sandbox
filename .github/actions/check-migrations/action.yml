name: "Check migrations"
description: >
  Fails if the Alembic migration graph has more than one head (Check A),
  or if any previously-present revision id has vanished (Check B).
  Reads files only — needs no database and no secrets.

inputs:
  alembic-ini:
    description: Path to alembic.ini, relative to the repo root.
    required: true
  versions-dir:
    description: Path to the versions/ directory, relative to the repo root.
    required: true
  base-ref:
    description: >
      Git ref to compare against for Check B (deleted/renamed revision
      ids). Leave empty to skip Check B — e.g. gate 5 has no Git history to
      diff against and relies on Check C instead.
    required: false
    default: ""
  alembic-version:
    description: >
      Alembic version to install. Pin this to the version the services
      actually run: a gate that disagrees with production about what counts
      as a head is the one thing it must never do.
    required: false
    default: "1.13.2"
  python-version:
    description: Python version to run the checks on.
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    # The action installs its own dependency rather than trusting the
    # caller to have done it. A GitHub-hosted runner has python3 but no
    # alembic, so without this every call fails with ModuleNotFoundError.
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Alembic
      shell: bash
      run: python -m pip install --quiet "alembic==${{ inputs.alembic-version }}"

    - name: Check A — exactly one head
      shell: bash
      run: python "${{ github.action_path }}/check_heads.py" "${{ inputs.alembic-ini }}"

    - name: Check B — no revision id deleted or renamed
      if: inputs.base-ref != ''
      shell: bash
      run: |
        bash "${{ github.action_path }}/check_ids.sh" \
          "${{ inputs.versions-dir }}" \
          "${{ inputs.base-ref }}"
